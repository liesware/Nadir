openapi: "3.1.0"
info:
  title: Nadir Reference Fixture API
  version: "1.0.0"

servers:
  - url: http://127.0.0.1:8080
    description: local test server

paths:
  /login:
    post:
      operationId: login
      summary: Authenticate and obtain a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              user: "fixture-user"
              pass: "test-password"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials

  /templates/{id}:
    get:
      operationId: getTemplate
      summary: Retrieve a template by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: Accept-Language
          in: header
          required: false
          schema:
            type: string
            enum: [en, es]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Template found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          description: Template not found

  /records:
    post:
      operationId: createRecord
      summary: Create a new record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordRequest"
            example:
              template_id: "tpl-123"
              reference: "abc-def-ghi"
              title: "Default Record"
              metadata:
                source: nadir
      responses:
        "201":
          description: Record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          description: Invalid request body
        "403":
          description: The caller's role may not create records
        "422":
          description: Unprocessable (e.g. reserved title)

  /records/{reference}:
    get:
      operationId: getRecordByReference
      summary: Look up a record by its reference string
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Record found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "404":
          description: No record with this reference

  /probe:
    post:
      operationId: probeString
      summary: Accept a string and echo it back (for fuzz-probe)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeRequest"
            example:
              value: "hello"
      responses:
        "200":
          description: Echo response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "400":
          description: The value is not a string of at most 5 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - user
        - pass
      properties:
        user:
          type: string
          minLength: 1
          example: "fixture-user"
        pass:
          type: string
          minLength: 1
          example: "test-password"

    LoginResponse:
      type: object
      required:
        - access_token
      properties:
        access_token:
          type: string
          minLength: 1
          example: "eyJhbGciOiJIUzI1NiJ9.dummy"

    Template:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          minLength: 1
          example: "tpl-123"
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "Invoice Template"

    CreateRecordRequest:
      type: object
      required:
        - template_id
        - reference
        - title
        - metadata
      properties:
        template_id:
          type: string
          minLength: 1
          example: "tpl-123"
        reference:
          type: string
          minLength: 1
          maxLength: 64
          example: "abc-def-001"
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "New Record"
        metadata:
          $ref: "#/components/schemas/Metadata"

    Metadata:
      type: object
      required:
        - source
      properties:
        source:
          type: string
          minLength: 1
          example: "nadir"

    Record:
      type: object
      required:
        - id
        - template_id
        - reference
        - title
        - metadata
      properties:
        id:
          type: string
          minLength: 1
          example: "rec-456"
        template_id:
          type: string
          minLength: 1
        reference:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        metadata:
          $ref: "#/components/schemas/Metadata"

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    ProbeRequest:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          minLength: 0
          maxLength: 5
          example: "hello"

    ProbeResponse:
      type: object
      required:
        - echo
      properties:
        echo:
          type: string
          minLength: 0
          example: "hello"
